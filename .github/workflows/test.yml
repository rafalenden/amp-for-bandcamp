name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # The Release workflow runs these tests before it publishes anything.
  workflow_call:

jobs:
  test:
    name: Test (${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - browser: chromium
          os: ubuntu-latest
        - browser: firefox
          os: ubuntu-latest
        # On macOS, WebKit plays audio through the same system frameworks as Safari.
        - browser: webkit
          os: macos-latest
    env:
      TEST_BROWSERS: ${{ matrix.browser }}

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - run: npx playwright install --with-deps ${{ matrix.browser }}
    # macOS WebKit only lets Tab reach buttons and sliders when keyboard
    # navigation is on, which it is not on a fresh runner. Turn it on for
    # Playwright's WebKit, as on a Mac where the popup's focus tests pass.
    - name: Let Tab reach every control in WebKit
      if: matrix.browser == 'webkit'
      run: defaults write org.webkit.Playwright AppleKeyboardUIMode -int 2
    - run: npm run ci

  # Known vulnerabilities in the packages that ship inside the extension.
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
    - run: npm run test:audit

  # The same build in Safari itself, which Playwright cannot drive.
  safari:
    name: Test (safari)
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - name: Serve the test page as a bandcamp.com host
      run: echo '127.0.0.1 amp-test.bandcamp.com' | sudo tee -a /etc/hosts
    - name: Allow Safari to be automated
      run: sudo safaridriver --enable
    - run: npm run test:safari
      env:
        SAFARI_DIAGNOSE: 1
        SAFARI_ANSWER_PROMPT: 1
        SAFARI_SCREENSHOT: safari-failure/screen.png
    - name: Collect safaridriver's log
      if: failure()
      run: cp -R ~/Library/Logs/com.apple.WebDriver safari-failure/log || true
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: safari-failure
        path: safari-failure
