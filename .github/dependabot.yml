# Weekly pull requests that keep dependencies up to date. Each ecosystem's
# minor and patch updates come as one pull request; major updates come one by
# one, because they may need code changes.
#
# Commit messages use the `build` type, so the commit-message check passes and
# a dependency update does not cause a release on its own.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # Matches the Node.js version the project runs on (22).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      bundler:
        update-types: [minor, patch]
