<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amp for Bandcamp</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="../../vendor/webextension-polyfill.min.js"></script>
    <script type="module" src="popup.js" defer></script>
  </head>
  <body>
    <h1>Amp for Bandcamp</h1>

    <fieldset class="settings">
      <legend>Settings</legend>
      <label class="settings-slider">
        Volume <span id="volumeValue">100%</span>
        <input
          type="range"
          id="volumeSlider"
          min="0"
          max="100"
          step="1"
          value="100"
        />
      </label>

      <label id="seekDurationSection" class="settings-slider">
        Seek duration <span id="seekSecondsValue">30s</span>
        <input type="range" id="seekSeconds" min="5" step="5" value="30" />
      </label>

      <label class="settings-leave-warning">
        <input type="checkbox" id="showLeaveWarning" checked />
        Warn when leaving the site during playback
      </label>

      <label class="settings-sticky-player">
        <input type="checkbox" id="stickyPlayer" checked />
        Pin player to the top of the album page
      </label>

      <label class="settings-auto-play-next">
        <input type="checkbox" id="autoPlayNext" checked />
        Play next track automatically
      </label>

      <label class="settings-progress-bar">
        <input type="checkbox" id="showProgressBar" checked />
        Show progress bar on supported pages
        <span
          class="settings-help"
          title="Currently, the custom progress bar is supported on the feed and album pages (for related tracks)."
        >
          i
        </span>
      </label>

      <label class="settings-keyboard-shortcuts">
        <input type="checkbox" id="enableKeyboardShortcuts" checked />
        Enable keyboard shortcuts
      </label>
    </fieldset>

    <fieldset class="shortcuts" id="keyboardShortcutsSection">
      <legend>Keyboard Shortcuts</legend>
      <dl>
        <dt><kbd>space</kbd></dt>
        <dd>Play/pause</dd>

        <dt><kbd>↑</kbd></dt>
        <dd>Previous track</dd>

        <dt><kbd>↓</kbd></dt>
        <dd>Next track</dd>

        <dt><kbd>→</kbd></dt>
        <dd>Seek forward</dd>

        <dt><kbd>←</kbd></dt>
        <dd>Seek backward</dd>

        <dt><kbd>w</kbd></dt>
        <dd>Add track to wishlist</dd>

        <dt><kbd>enter</kbd></dt>
        <dd>Open track in a new tab</dd>
      </dl>
    </fieldset>
  </body>
</html>
